id: w005
title: "Splitting the bill"
concept: numbers
after: s01-t02
code: |
  total_cents = 1000
  people = 3
  share = total_cents // people
  print(share)
question: "What does this print?"
choices: ["333.33", "334", "3", "333"]
answer: 3
explain: "// divides and then drops anything after the decimal point, so 1000 // 3 is 333 (not rounded up)."
