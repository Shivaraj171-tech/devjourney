id: w004
title: "Three pizzas, please"
concept: numbers
after: s01-t02
code: |
  price_cents = 450
  quantity = 3
  total = price_cents * quantity
  print(f"${total / 100:.2f}")
question: "What does this print?"
choices: ["$4.50", "$13.50", "$1350.00", "$135.00"]
answer: 1
explain: "450 * 3 is 1350 cents, and dividing by 100 gives 13.5 dollars, shown with 2 decimals."
