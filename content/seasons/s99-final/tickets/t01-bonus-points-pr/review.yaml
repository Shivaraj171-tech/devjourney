title: "Add welcome + birthday bonuses"
author: "Byte 🤖"
description: |
  Adds `loyalty/bonus.py` with two new bonuses:

  - **Welcome bonus:** 200 points on a customer's first order.
  - **Birthday bonus:** 100 points on their birthday, once a year.

  Tested: `is_birthday(date(1990, 5, 14), date(2026, 5, 14))` returns `True`.

  Ready to merge.
files: [loyalty/bonus.py]
issues:
  - file: loyalty/bonus.py
    line: 20
    explain: >
      `or` should be `and`. With `or`, any day in the birthday month (or the same
      day number in any month) counts as a birthday: someone born on 14 May gets
      the bonus on 3 May and on 14 June too. Byte only tested the one input that
      matches both.
  - file: loyalty/bonus.py
    line: 23
    also_lines: [32]
    explain: >
      `years_paid=[]` is a mutable default argument: Python creates that list ONCE
      and shares it between every call that doesn't pass its own list. The first
      customer to get a 2026 birthday bonus fills it, and every other customer is
      then refused theirs.
  - file: loyalty/bonus.py
    line: 33
    explain: >
      Python lists have no `.push()` method (that's JavaScript). It's `.append()`.
      This line raises `AttributeError` the first time anyone has a birthday:
      a made-up API that Byte never actually ran.
