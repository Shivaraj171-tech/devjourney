questions:
  - prompt: "With the old code, roughly what happens to the work when the number of orders doubles?"
    choices:
      - "It doubles, because there are twice as many orders to look at"
      - "It roughly quadruples"
      - "It stays the same, because the list is only read once per order"
    answer: 1
    explain: "The logs show it: 1200 orders took 1240ms, 2400 took 4960ms. A loop with a list search inside it grows with orders × sent ids."
  - prompt: "Why build the set before the loop, not inside it?"
    choices:
      - "set() can't be called inside a for loop"
      - "Building a set reads the whole list; per order, that's as slow as before"
      - "It makes no difference: Python builds the set once and reuses it automatically"
    answer: 1
    explain: "Building the set is one pass over the list. Do it once and every check afterwards is instant; do it per order and you're back to re-reading the list every time."
  - prompt: "Why do the tests count 'looks' instead of timing the code with a clock?"
    choices:
      - "Timings vary between runs and computers; the work doesn't"
      - "Python's time functions are only accurate to a whole second"
      - "Counting is always faster than timing, so the tests finish sooner"
    answer: 0
    explain: "A timing test can pass on a fast laptop and fail on a busy one. Counting the work makes the test reliable, which is what you want from CI."
