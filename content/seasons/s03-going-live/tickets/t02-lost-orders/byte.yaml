# Correct: convert the id once, before the Order is built.
suggestion:
  file: app/storage.py
  find: "    for order_id, fields in data.items():"
  replace: "    for order_id, fields in data.items():\n        order_id = int(order_id)"
  correct: true
  says: "JSON turned your ids into text. Turn each one back into a number first, before the Order is built."
  explain: >-
    Correct. Converting at the top of the loop fixes both the dictionary key AND order.order_id. A
    tempting half-fix is `orders[int(order_id)] = order`: lookups work again, but every Order still
    carries the text id "1001" inside it.

