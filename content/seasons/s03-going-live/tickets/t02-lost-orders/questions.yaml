questions:
  - prompt: "What does json.dumps({1001: \"Sam\"}) return?"
    choices:
      - "The text {\"1001\": \"Sam\"}"
      - "The text {1001: \"Sam\"}"
      - "It raises an error, because keys must be strings"
    answer: 0
    explain: "json.dumps quietly turns number keys into strings, because JSON only has text keys. That's why the orders came back as '1001'."
  - prompt: "After the fix, which of these still doesn't survive a JSON round trip unchanged?"
    choices:
      - "The items list [1250, 450]"
      - "An Order object itself, which json.dumps can't save directly"
      - "The status text \"cooking\""
    answer: 1
    explain: "json only knows basic types like dictionaries, lists, strings and numbers. That's why orders_to_json copies each Order's data into a plain dictionary, and orders_from_json builds a new Order from it."
  - prompt: "Why did the bug only show up after the 3 a.m. restart?"
    choices:
      - "Orders created during the day were never saved"
      - "Before the restart, the orders were still the originals in memory with number ids; only loaded orders had text ids"
      - "JSON files expire at midnight"
    answer: 1
    explain: "The data only changed shape on its way through JSON. Bugs at the boundary between a program and its saved data often hide until a restart, a deploy or a second server."
