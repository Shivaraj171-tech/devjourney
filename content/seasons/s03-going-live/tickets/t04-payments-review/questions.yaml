questions:
  - prompt: "The phone app already shows the right total. Why must the server still work it out itself?"
    choices:
      - "It doesn't need to: the app and server always agree"
      - "Anyone can send the server a modified request, so a total from outside can't be trusted"
      - "Phones round prices differently, so the server's maths is more accurate"
    answer: 1
    explain: "The server can't know whether a request came from your app or from someone with a script. Prices, totals and permissions come from data the server controls."
  - prompt: "What's the safest thing to write in a log line about a payment?"
    choices:
      - "The full card number, so support can trace the payment"
      - "The order id and a masked card (**** 4242)"
      - "The card number and expiry date, but never the security code"
    answer: 1
    explain: "Logs are read by many people and tools and kept for a long time. The order id and last 4 digits are enough to trace a payment."
  - prompt: "How do you stop SQL injection in order_history_query?"
    choices:
      - "A ? placeholder, with the name passed separately"
      - "Use double quotes instead of single quotes around the name in the query"
      - "Remove spaces from the name first, because injected SQL needs spaces"
    answer: 0
    explain: "With placeholders the database never mixes the name into the command text, so a name like x' OR '1'='1 is just a strange name. Swapping quote styles just moves the problem."
