questions:
  - prompt: "What's the goal of a refactoring?"
    choices:
      - "Add a new feature as quickly as possible"
      - "Change the code's shape, not its behaviour"
      - "Make the code as short as possible, even if some results change slightly"
    answer: 1
    explain: "Refactoring changes the shape, not the behaviour. Here the one behaviour change (the SMS discount) was a bug fix that the single order_total made obvious."
  - prompt: "Why did the SMS show $27.99 when the email showed $22.40?"
    choices:
      - "The SMS used a different promo code table, with ORBIT20 missing"
      - "The SMS copy of the maths left out the discount"
      - "Text messages round prices, so $22.40 got rounded back up to $27.99"
    answer: 1
    explain: "Copy-pasted code drifts apart. With one order_total, every message gets the same answer, including any future pricing changes."
  - prompt: "How can a test check that receipt_email really calls order_total?"
    choices:
      - "It can't: a test only sees what the function returns"
      - "Swap order_total for a fake and check the email shows it"
      - "Search receipts.py for the text \"order_total(\" inside receipt_email"
    answer: 1
    explain: "That's what the last check does: it replaces order_total with a fake that always says $42.42. Any message that still does its own maths won't show $42.42."
