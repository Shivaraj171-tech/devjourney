# Prompt card: a refactor needs a clear target and the right source of truth.
prompt:
  goal: "Ask Byte to write the ONE `order_total` that all three messages will use."
  options:
    - prompt: "refactor receipts.py"
      response_code: |
        class ReceiptService:
            def __init__(self, order, promo_code=None):
                self.order = order
                self.promo_code = promo_code

            def total(self):
                return self.order.subtotal() + delivery_fee(self.order.subtotal())
      verdict: vague
      feedback: >-
        "Refactor" can mean anything. Byte invented a class nobody asked for, and its total quietly
        dropped the discount, so behaviour changed. Say what should change AND what must stay the same.
    - prompt: "Write order_total(order, promo_code=None) in app/receipts.py. It's what the customer pays in cents: order.subtotal() minus discount_amount(subtotal, promo_code) plus delivery_fee(subtotal). Don't change any behaviour."
      response_code: |
        def order_total(order, promo_code=None):
            subtotal = order.subtotal()
            discount = discount_amount(subtotal, promo_code)
            return subtotal - discount + delivery_fee(subtotal)
      verdict: good
      feedback: >-
        Exact name, exact formula, and "don't change behaviour". Byte's answer matches the two
        copies that were right. Making the three messages call it is still your job.
    - prompt: "Make all the receipts show the same total. The SMS one is correct, copy that."
      response_code: |
        def order_total(order, promo_code=None):
            subtotal = order.subtotal()
            return subtotal + delivery_fee(subtotal)
      verdict: wrong
      feedback: >-
        You pointed Byte at the wrong source of truth: the SMS is the copy that FORGOT the discount.
        Byte copied the bug into the one place everything will now use. Context only helps when
        it's correct.
  best: 1

# A correct refactor: one order_total, and all three messages call it.
suggestion:
  file: app/receipts.py
  find: "    return 0\n\n\ndef receipt_email(order, promo_code=None):\n    \"\"\"The email receipt, e.g. 'Thanks Sam! Order 1001 total: $22.40'.\"\"\"\n    subtotal = order.subtotal()\n    discount = discount_amount(subtotal, promo_code)\n    total = subtotal - discount + delivery_fee(subtotal)\n    return f\"Thanks {order.customer}! Order {order.order_id} total: {format_price(total)}\"\n\n\ndef confirmation_sms(order, promo_code=None):\n    \"\"\"The text message, e.g. 'Orbit Orders: order 1001 confirmed, $22.40 paid.'\"\"\"\n    subtotal = order.subtotal()\n    total = subtotal + delivery_fee(subtotal)\n    return f\"Orbit Orders: order {order.order_id} confirmed, {format_price(total)} paid.\"\n\n\ndef loyalty_points(order, promo_code=None):\n    \"\"\"One loyalty point per whole dollar paid, e.g. $22.40 earns 22 points.\"\"\"\n    subtotal = order.subtotal()\n    discount = discount_amount(subtotal, promo_code)\n    total = subtotal - discount + delivery_fee(subtotal)\n    return total // 100"
  replace: "    subtotal = order.subtotal()\n    discount = discount_amount(subtotal, promo_code)\n    return subtotal - discount + delivery_fee(subtotal)\n\n\ndef receipt_email(order, promo_code=None):\n    \"\"\"The email receipt, e.g. 'Thanks Sam! Order 1001 total: $22.40'.\"\"\"\n    total = order_total(order, promo_code)\n    return f\"Thanks {order.customer}! Order {order.order_id} total: {format_price(total)}\"\n\n\ndef confirmation_sms(order, promo_code=None):\n    \"\"\"The text message, e.g. 'Orbit Orders: order 1001 confirmed, $22.40 paid.'\"\"\"\n    total = order_total(order, promo_code)\n    return f\"Orbit Orders: order {order.order_id} confirmed, {format_price(total)} paid.\"\n\n\ndef loyalty_points(order, promo_code=None):\n    \"\"\"One loyalty point per whole dollar paid, e.g. $22.40 earns 22 points.\"\"\"\n    return order_total(order, promo_code) // 100"
  correct: true
  says: "Refactored: `order_total` does the maths once, and the email, SMS and points all call it."
  explain: >-
    Correct, and it fixes the SMS too, because the copy that forgot the discount is gone. A big diff
    like this is exactly when to slow down: check that each message still says the same words, and let
    the tests (including the one that swaps order_total for a fake) confirm nothing else moved.
