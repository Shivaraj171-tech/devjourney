# Prompt card: give Byte the real names, or it invents them.
prompt:
  goal: "Ask Byte to write `Order.label()` for the kitchen screen."
  options:
    - prompt: "Write label() for the Order class. It should return a friendly kitchen-screen line with the order number, the customer's name and the total price in dollars, exactly like 'Order 1001 for Sam: $17.00', for any order."
      response_code: |
        def label(self):
            return f"Order {self.id} for {self.customer_name}: {self.total_price().format()}"
      verdict: wrong
      feedback: >-
        self.id, self.customer_name and total_price() don't exist: Byte guessed what an Order "usually" has.
        Python only complains when the line runs, so this would crash the kitchen screen, not your editor.
    - prompt: "Write a label function that shows the order."
      response_code: |
        def label(self):
            print(f"Order {self.order_id} for {self.customer}: {self.subtotal()}")
      verdict: vague
      feedback: >-
        "Shows" made Byte print instead of return, so label() gives back None, and the price is raw cents
        (1700). Say exactly what the function returns, with an example.
    - prompt: "Write Order.label() in app/order.py. Return e.g. 'Order 1001 for Sam: $17.00'. Use self.order_id, self.customer, self.subtotal() and format_price from app/menu.py (already imported)."
      response_code: |
        def label(self):
            return f"Order {self.order_id} for {self.customer}: {format_price(self.subtotal())}"
      verdict: good
      feedback: >-
        Real attribute and function names plus an exact example: nothing left to invent. Byte's line uses
        only things that exist in order.py.
  best: 2
