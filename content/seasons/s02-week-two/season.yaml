id: s02
title: "Week Two: The AI Pair"
intro: |
  Monday: Byte, the office robot that did our autocomplete last week, got
  promoted to AI pair programmer. It now writes whole features and opens its own
  pull requests, *fast*. Some of them are right. This week you review Byte's
  pull requests, fix what slips through, and keep production up when it doesn't.
  Reading and checking code is now half the job.
