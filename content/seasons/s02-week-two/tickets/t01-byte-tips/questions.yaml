questions:
  - prompt: "Byte said it was \"99.7% confident\" the code was correct. How should you treat AI-written code?"
    choices:
      - "Merge it: an AI that confident is almost never wrong"
      - "Review it like any teammate's code: check it against what it should do, with real examples"
      - "Never use AI-written code at all"
    answer: 1
    explain: "AI assistants are useful but can be confidently wrong. Reading the code and trying real inputs is how you catch bugs before customers do."
  - prompt: "Why is prices.append(tip) a problem inside total_with_tip?"
    choices:
      - "append is slow on long lists"
      - "It changes the caller's cart list: the tip shows up in the cart as an extra item"
      - "append only works on lists of strings"
    answer: 1
    explain: "The function gets the customer's actual cart list, not a copy, so appending changes the real cart. A function that only works out a total shouldn't change its input."
