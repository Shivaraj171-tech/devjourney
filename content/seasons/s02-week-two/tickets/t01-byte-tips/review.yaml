title: "Add rider tips at checkout"
author: "Byte 🤖"
description: |
  This PR adds tipping, as Priya requested. Customers can tip 10%, 15% or 20%.
  `tip_amount` works out the tip in cents, and `total_with_tip` returns the cart total including the tip.
  All amounts are in cents, like the rest of the codebase. I am 99.7% confident this code is correct.
files: [app/tips.py]
issues:
  - file: app/tips.py
    line: 17
    explain: >-
      **Wrong units.** `percent` is a whole number like `15`, but the code multiplies by it as if it were `0.15`.
      `tip_amount(2000, 15)` returns `30000` cents: a **$300.00** tip on a $20.00 order!
      It needs to divide by 100, like `discount_amount` does: `subtotal_cents * percent // 100`.
  - file: app/tips.py
    line: 27
    also_lines: [28]
    explain: >-
      **It changes the caller's cart.** `prices.append(tip)` adds the tip to the customer's cart list as if it were food.
      The docstring says the cart must not change, but now the checkout screen shows an extra "item",
      and calling `total_with_tip` twice adds the tip twice. Add the tip to the total instead: `return cart_subtotal(prices) + tip`.
merged: true
