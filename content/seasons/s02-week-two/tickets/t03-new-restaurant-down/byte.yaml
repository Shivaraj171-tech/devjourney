# Right place, wrong check: a list is never equal to the number 0.
suggestion:
  file: app/ratings.py
  find: "    average = average_rating(ratings)\n    if len(ratings) == 0:\n        return \"New!\""
  replace: "    if ratings == 0:\n        return \"New!\"\n    average = average_rating(ratings)"
  correct: false
  why:
    choices:
      - "Catching the error stops the crash, which is all the ticket asks for."
      - "`try/except` can't catch ZeroDivisionError, so checkout still crashes."
      - "New restaurants would get an empty label instead of \"New!\"."
    answer: 2
  says: "The check ran too late, so I moved it to the top. New restaurants get \"New!\" before any maths."
  explain: >-
    Moving the check first is the right idea, but `ratings == 0` compares a LIST with the NUMBER 0,
    which is never True, so [] still reaches average_rating and crashes. Check the length: `len(ratings)
    == 0`. Read every character of the line an AI moves, not just where it moved to.

