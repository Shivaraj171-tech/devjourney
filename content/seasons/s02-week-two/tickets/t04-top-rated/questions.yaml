questions:
  - prompt: "What does True and False evaluate to?"
    choices:
      - "True"
      - "False"
      - "It raises an error"
    answer: 1
    explain: "and is only True when both sides are True. One False side makes the whole thing False."
  - prompt: "Why must len(ratings) >= 5 come BEFORE average_rating(ratings) in the and?"
    choices:
      - "It doesn't matter: Python checks both sides of an and before deciding"
      - "and stops at the first False, so for an empty list average_rating never even runs"
      - "len() has to come first because Python reads conditions from right to left"
    answer: 1
    explain: "This is called short-circuiting. With the cheap, safe check first, the risky one only runs when it's safe."
