# Prompt card: what you ask decides what you get.
prompt:
  goal: "Ask Byte to fix `total_with_tip`, so working out a total never changes the customer's cart."
  options:
    - prompt: "fix the tips bug"
      response_code: |
        def tip_amount(subtotal_cents, percent):
            return round(subtotal_cents * percent / 100)
      verdict: vague
      feedback: >-
        Which bug? There are two, so Byte picked one and "fixed" it with round(), which sometimes
        rounds UP, while the docstring says round down. A vague prompt makes Byte guess, and it
        guesses with total confidence.
    - prompt: "Make total_with_tip work without mutating anything: give it its own copy of the list with cart = prices, append the tip to that copy instead, and return cart_subtotal of the copy. Leave tip_amount exactly as it is."
      response_code: |
        def total_with_tip(prices, percent):
            cart = prices
            tip = tip_amount(cart_subtotal(cart), percent)
            cart.append(tip)
            return cart_subtotal(cart)
      verdict: wrong
      feedback: >-
        Byte did what you said, literally: `cart = prices` isn't a copy, it's a second name for
        the SAME list, so the cart still changes. Telling an AI HOW to do something only helps
        if your "how" is right; it's safer to describe the result you need.
    - prompt: "In app/tips.py, total_with_tip appends the tip to prices, so the customer's cart changes. Return the cart subtotal plus the tip, and don't modify prices: the cart must be the same after the call."
      response_code: |
        def total_with_tip(prices, percent):
            tip = tip_amount(cart_subtotal(prices), percent)
            return cart_subtotal(prices) + tip
      verdict: good
      feedback: >-
        It names the file and function, says what's wrong, and states the rule the result must
        follow ("the cart must be the same"). Byte's answer is short and does exactly that.
        The tip maths in tip_amount is still yours to fix, and the tests are still how you check.
  best: 2

# Right: Byte fixes both bugs from the review: the tip maths and the side effect.
suggestion:
  file: app/tips.py
  find: "    return int(subtotal_cents * percent)\n\n\ndef total_with_tip(prices, percent):\n    \"\"\"Return the cart total in cents with the tip added.\n\n    prices is the cart: a list of prices in cents. The checkout screen\n    shows the cart again afterwards, so the cart itself must not change.\n    \"\"\"\n    tip = tip_amount(cart_subtotal(prices), percent)\n    prices.append(tip)\n    return cart_subtotal(prices)"
  replace: "    return subtotal_cents * percent // 100\n\n\ndef total_with_tip(prices, percent):\n    \"\"\"Return the cart total in cents with the tip added.\n\n    prices is the cart: a list of prices in cents. The checkout screen\n    shows the cart again afterwards, so the cart itself must not change.\n    \"\"\"\n    tip = tip_amount(cart_subtotal(prices), percent)\n    return cart_subtotal(prices) + tip"
  correct: true
  says: "Sorry about that PR! The tip is now a real percent, and it goes in the total, not in the customer's cart."
  explain: >-
    Byte is right this time. `subtotal_cents * percent // 100` takes 15% and rounds down (a $20.00 order
    gets a $3.00 tip, not $300.00), and `cart_subtotal(prices) + tip` works out the total without
    touching the cart. Both bugs from your review are gone, and nothing else changed.
