  - goal: >-
      Write `dls(J, e, lam)`: the damped least-squares step for a list-of-rows J (`matmul`, `transpose`,
      `mat_vec` and `solve` exist). Byte left one wrong line in the mix.
    lines:
      - "def dls(J, e, lam):"
      - "    A = matmul(J, transpose(J))"
      - "    A = [[A[i][j] + (lam * lam if i == j else 0.0) for j in range(len(A))] for i in range(len(A))]"
      - "    return mat_vec(transpose(J), solve(A, e))"
    distractors:
      - line: "    A = [[A[i][j] + (lam if i == j else 0.0) for j in range(len(A))] for i in range(len(A))]"
        replaces: 2
        explain: "λ squared: the cost is λ² |dq|², and the multiplier σ / (σ² + λ²)."
    check: |
      def transpose(A):
          return [list(r) for r in zip(*A)]
      def matmul(A, B):
          return [[sum(A[i][k] * B[k][j] for k in range(len(B))) for j in range(len(B[0]))] for i in range(len(A))]
      def mat_vec(A, v):
          return [sum(a * b for a, b in zip(row, v)) for row in A]
      def solve(A, b):
          return [b[0] / A[0][0], b[1] / A[1][1]]
      dq = dls([[1.0, 0.0], [0.0, 0.01]], [1.0, 1.0], 0.1)
      assert abs(dq[0] - 1 / 1.01) < 1e-9 and abs(dq[1] - 0.01 / 0.0101) < 1e-9, dq
    explain: "J Jᵀ plus λ² on the diagonal, solve, then back through Jᵀ."
