      def clamp_scale(dq, m):
          big = max(abs(x) for x in dq)
          return [round(x * m / big, 3) for x in dq] if big > m else dq
      def clamp_each(dq, m):
          return [max(-m, min(m, x)) for x in dq]
      dq = [0.1, -0.6, 0.3]
      print(clamp_scale(dq, 0.2), clamp_each(dq, 0.2))
