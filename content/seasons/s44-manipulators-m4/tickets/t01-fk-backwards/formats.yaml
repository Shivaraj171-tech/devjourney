      import math
      l1, l2 = 0.5, 0.4
      hits = 0
      for i in range(0, 360, 2):
          for j in range(0, 360, 2):
              q1, q2 = math.radians(i), math.radians(j)
              x = l1 * math.cos(q1) + l2 * math.cos(q1 + q2)
              z = l1 * math.sin(q1) + l2 * math.sin(q1 + q2)
              if math.hypot(x - 0.6, z - 0.2) < 0.02:
                  hits += 1
      print(hits > 0, hits > 1)
