      - "(0.5, 0.1, 0.3)"
      - "(0.5, 0, 0.4)"
      - "(0.4, 0, 0.3)"
    answer: 0
    explain: "p - D6 z6 = (0.5, 0, 0.3) - 0.1 (0, 1, 0): back off along the gripper's own approach direction."
  - prompt: "Why can joints 1-3 be solved before joints 4-6?"
    choices:
      - "Joints 4-6 turn about the wrist centre, so they can't move it"
      - "Joints 1-3 are bigger, so they're always solved first"
      - "Joints 4-6 don't affect the flange's position at all"
    answer: 0
    explain: "The wrist centre is on all three wrist axes, so it stays put while they turn. (The flange itself does move with the wrist: it's D6 away.)"
  - prompt: "With q1-q3 found, what rotation must the wrist (joints 4-6) produce?"
    choices:
      - "R_3_6 = R_0_3ᵀ R"
      - "R_3_6 = R R_0_3"
      - "R_3_6 = R"
    answer: 0
    explain: "R = R_0_3 R_3_6, so R_3_6 = R_0_3⁻¹ R = R_0_3ᵀ R: what's left to do after frame 3."
  - prompt: "How many IK solutions can a 6-DOF arm with a spherical wrist have for one pose?"
    choices:
      - "Up to 8: 2 shoulders × 2 elbows × 2 wrists"
      - "Up to 4: the wrist adds no choices"
      - "Exactly 1, since the wrist centre is unique"
    answer: 0
    explain: "The wrist centre is unique, but reaching it has 4 solutions, and each wrist has a flipped twin (q5 ↔ -q5)."
