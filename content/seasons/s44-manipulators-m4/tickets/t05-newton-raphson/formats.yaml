      import math
      def newton_sqrt2(x, steps):
          out = []
          for _ in range(steps):
              x = x - (x * x - 2) / (2 * x)
              out.append(f"{abs(x - math.sqrt(2)):.0e}")
          return out
      print(newton_sqrt2(1.0, 4))
