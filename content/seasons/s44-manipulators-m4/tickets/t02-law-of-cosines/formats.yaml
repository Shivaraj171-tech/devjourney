predict:
  - code: |
      import math
      print(round(math.atan(1 / -1), 3), round(math.atan2(1, -1), 3), round(math.atan2(-1, 1), 3))
    question: "atan versus atan2, for the directions (-1, 1) and (1, -1). What does it print?"
    answer: "-0.785 2.356 -0.785"
    choices:
      - "-0.785 2.356 -0.785"
      - "2.356 2.356 -0.785"
      - "-0.785 -0.785 -0.785"
      - "0.785 2.356 0.785"
    explain: >-
      atan(y / x) only sees the ratio: (-1, 1) and (1, -1) both give -1, so both get -45°. atan2 sees the signs:
      the point up and to the left is at 135°.
parsons:
  - goal: >-
      Write `elbow_angle(x, z, l1, l2, up)`: the elbow angle q2 by the law of cosines, safe at full reach (math is
      imported). Byte's version left one line in the pile that you won't need.
    lines:
      - "def elbow_angle(x, z, l1, l2, up):"
      - "    c2 = (x * x + z * z - l1 * l1 - l2 * l2) / (2 * l1 * l2)"
      - "    c2 = max(-1.0, min(1.0, c2))"
      - "    s2 = math.sqrt(1 - c2 * c2)"
      - "    return math.atan2(-s2 if up else s2, c2)"
    distractors:
      - line: "    return math.acos(c2)"
        replaces: 4
        explain: "acos always returns a value in [0, π]: it can't give the elbow-up (negative) bend."
    check: |
      import math
      a = 0.5
      assert abs(elbow_angle(0.9 * math.cos(a), 0.9 * math.sin(a), 0.5, 0.4, True)) < 1e-6
      assert abs(elbow_angle(0.6, 0.2, 0.5, 0.4, True) + 1.596) < 1e-3
      assert abs(elbow_angle(0.6, 0.2, 0.5, 0.4, False) - 1.596) < 1e-3
    explain: "Clamp before the square root, and let atan2 carry the elbow's sign."
