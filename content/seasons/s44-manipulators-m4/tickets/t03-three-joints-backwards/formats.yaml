predict:
  - code: |
      import math
      def wrap(a):
          a = math.fmod(a + math.pi, 2 * math.pi)
          if a <= 0:
              a += 2 * math.pi
          return a - math.pi
      q1 = math.atan2(0.4, 0.3)
      print(round(q1, 3), round(q1 + math.pi, 3), round(wrap(q1 + math.pi), 3))
    question: "The front base angle for the box, the back one, and the back one wrapped. What does it print?"
    answer: "0.927 4.069 -2.214"
    choices:
      - "0.927 4.069 -2.214"
      - "0.927 -2.214 -2.214"
      - "0.927 4.069 4.069"
      - "0.927 2.214 -2.214"
    explain: >-
      q1 + π is the same physical angle as q1 - π = -2.214. Wrapping into (-π, π] makes equal solutions look
      equal, and keeps the base within its limits.
