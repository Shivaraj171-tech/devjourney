    answer: "d = 0.0 | offset = 0.2"
    choices:
      - "d = 0.0 | offset = 0.2"
      - "d = 0.2 | offset = 0.0"
      - "d = 0.5 | offset = 0.0"
    explain: >-
      Unpacking goes by position, not by name: the third column (the 0.2 m pedestal height) lands in the variable
      called offset, and becomes 0.2 rad added to the joint angle. Nothing complains; the arm just sits on the floor.
