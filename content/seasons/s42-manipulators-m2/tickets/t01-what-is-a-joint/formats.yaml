    question: "A SCARA (the classic pick-and-place arm: two hinges, a vertical slide, a wrist turn). How many DOF?"
    answer: "4"
    choices:
      - "4"
      - "6"
      - "10"
      - "-2"
    explain: >-
      An open chain: J = N - 1, so the first term is 0 and dof = 1 + 1 + 1 + 1 = 4. Four DOF is exactly what
      pick-and-place needs: x, y, z and a turn about the vertical. It can't tilt a box: no roll or pitch.
