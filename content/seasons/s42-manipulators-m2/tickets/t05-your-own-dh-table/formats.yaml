parsons:
  - goal: >-
      Build the DH table (a, alpha, d, theta_offset) of a planar 3-link finger on a 0.10 m post: three parallel
      vertical hinges, links 0.05, 0.04 and 0.03 m. The rows go joint 1 first. One row is Byte's: leave it out.
    lines:
      - "FINGER = ["
      - "    [0.05, 0.0, 0.10, 0.0],"
      - "    [0.04, 0.0, 0.0, 0.0],"
      - "    [0.03, 0.0, 0.0, 0.0],"
      - "]"
    distractors:
      - line: "    [0.0, 0.0, 0.10 + 0.05, 0.0],"
        replaces: 1
        explain: >-
          The post (along z0) is a d; the first link (along x1, between two parallel axes) is an a. Adding them in
          the d column lifts the finger 0.15 m and leaves the first link with no length at all.
    check: |
      import math
      def dh(a, alpha, d, theta):
          ct, st, ca, sa = math.cos(theta), math.sin(theta), math.cos(alpha), math.sin(alpha)
          return [[ct, -st * ca, st * sa, a * ct], [st, ct * ca, -ct * sa, a * st], [0, sa, ca, d], [0, 0, 0, 1]]
      def mul(A, B):
          return [[sum(A[i][k] * B[k][j] for k in range(4)) for j in range(4)] for i in range(4)]
      T = [[float(i == j) for j in range(4)] for i in range(4)]
      for (a, alpha, d, off), q in zip(FINGER, [math.pi / 2, 0.0, -math.pi / 2]):
          T = mul(T, dh(a, alpha, d, q + off))
      tip = [T[0][3], T[1][3], T[2][3]]
      assert max(abs(x - y) for x, y in zip(tip, (0.03, 0.09, 0.10))) < 1e-9, tip
    explain: "Parallel axes: α = 0 everywhere, each link length in the a column, the post's height once, as row 1's d."
predict:
  - code: |
      import math
      alpha = math.radians(90)
      z_old = (0, 0, 1)
      # Rx(alpha) sends z to (0, -sin(alpha), cos(alpha))
      z_new = (0, round(-math.sin(alpha)) + 0, round(math.cos(alpha)) + 0)
      print(z_new)
    question: "Row 1 of the RRR arm twists by α = +90° about x1. Where does z1 (the shoulder's axis) point at q1 = 0?"
    answer: "(0, -1, 0)"
    choices:
      - "(0, -1, 0)"
      - "(0, 1, 0)"
      - "(0, 0, 1)"
      - "(1, 0, 0)"
    explain: >-
      Rx(+90°) turns y towards z and z towards -y: the shoulder's axis is horizontal, along -y. Turning positively
      about -y swings x upwards, which is why positive q2 lifts the arm in ticket 3.
