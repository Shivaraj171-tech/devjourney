    choices:
      - "The elbow's: T_0_1 is already a base-frame pose, the others aren't"
      - "The tip's at q = (0, 0): every link transform is the identity at zero angles"
      - "None of them: returning the wrong frames makes every single FK test fail"
    answer: 0
    explain: "The first link transform is both 'link 1 in the base' and T_0_1. From the second joint on, each one is relative. The tip at (0, 0) fails too: Tx(l2) alone gives (0.4, 0, 0), not (0.9, 0, 0)."
