    choices:
      - "T_1_2 is written in the elbow's frame, which moves with link 1"
      - "Matrix products are written in the order the motors are wired, from the base controller"
      - "It doesn't matter: for links in a plane, T_0_1 T_1_2 and T_1_2 T_0_1 always give the same tip"
