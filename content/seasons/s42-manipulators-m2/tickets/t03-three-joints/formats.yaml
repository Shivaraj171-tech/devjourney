      def compose(*names):
          start, at = names[0].split("_")
          for name in names[1:]:
              a, b = name.split("_")
              if a != at:
                  return "mismatch: " + at + " vs " + a
              at = b
          return start + "_" + at

      print(compose("0_1", "1_2", "2_3"), "|", compose("2_3", "1_2", "0_1"))
