questions:
  - prompt: "From the UR5's table, what is the flange's height (z) at the home pose?"
    choices:
      - "d1 - d5 = -0.0055 m"
      - "d1 + d4 + d5 + d6 = 0.376 m"
      - "d1 = 0.089 m"
      - "0: the flange is always level with the base"
    answer: 0
    explain: "At home the shoulder is d1 up, the wrist offsets d4 and d6 run sideways (-y), and d5 runs down: 0.089159 - 0.09465 = -0.005491 m, just below the base's mounting plane."
  - prompt: "Why are a2 and a3 negative in the UR5's table?"
    choices:
      - "a is measured along x_i, and UR's x2, x3 point back along the arm"
      - "They are typos in the datasheet that everyone copies, kept for backward compatibility"
      - "Negative a means the joint is prismatic and slides backwards"
    answer: 0
    explain: "a is a signed distance along x_i. With x2 and x3 chosen to point the other way, the link lengths come out negative: at home the arm lies along the base's -x axis."
  - prompt: "How many 4x4 DH matrices are multiplied to get the UR5's flange pose, and what is the product of the first three?"
    choices:
      - "6; the first three give frame 3: the end of the forearm"
      - "7; the first three give the flange's orientation"
      - "6; the first three are always the identity at home"
    answer: 0
    explain: "One matrix per joint: T_0_6 = A1 ... A6. Every prefix A1 ... Ak is frame k's pose in the base: that's how the 3D view draws all six frames."
  - prompt: "You need millimetre accuracy on a real UR5. Are the datasheet's DH numbers enough?"
    choices:
      - "No: they're nominal; use the robot's own calibration file"
      - "Yes: DH parameters are exact by definition, since they come from the CAD drawing"
      - "Yes, as long as you use the e-Series table instead"
    answer: 0
    explain: "Each arm is calibrated at the factory; its real parameters differ from the nominal ones by about a millimetre. The UR5e is a different model with a different table."
