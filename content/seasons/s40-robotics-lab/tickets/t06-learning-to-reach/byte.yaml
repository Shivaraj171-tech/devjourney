# Wrong: Byte adds the goal but keeps paying for hovering.
suggestion:
  file: grabby/reach_env.py
  find: "    if distance_to_box(next_state) < NEAR_DISTANCE:"
  replace: "    if distance_to_box(next_state) < GOAL_DISTANCE:\n        return next_state, 10.0, True\n    if distance_to_box(next_state) < NEAR_DISTANCE:"
  correct: false
  why:
    choices:
      - "Accept: now reaching the box ends the episode with a +10 bonus, which is the whole ticket."
      - "Reject: done=True should never be returned by step(), only by the training loop."
      - "Reject: hovering near the box still pays +1 a move, more over an episode than +10 once."
    answer: 2
  says: "Reaching the box now ends the episode with a bonus. I kept the 'near' reward. It helps it learn faster."
