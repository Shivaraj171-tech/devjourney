      feedback: >-
        Byte tuned the learning code, which was fine. The learner is learning perfectly well: it learned
        the goal the rewards describe, which is hovering. A vague complaint gets a confident change in
        the wrong file.
    - prompt: "In grabby/reach_env.py, step() pays +1 for every move near the box and never ends the episode, so the learner hovers. Make reaching the box (distance < GOAL_DISTANCE) end the episode with +10, and make every other move cost -1. Don't change qlearn.py."
