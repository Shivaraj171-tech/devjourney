questions:
  - prompt: "With Grabby's links (1.0 m and 0.8 m), what does the fixed `forward(0, 90)` return, rounded to 2 decimals?"
    choices:
      - "(1.0, 0.8)"
      - "(0.0, 1.8)"
      - "(0.8, 1.0)"
      - "(1.8, 0.0)"
    answer: 0
    explain: "The upper arm lies flat along x, so the elbow is at (1.0, 0). The forearm points along 0 + 90 = 90 degrees, straight up, adding 0.8 to y."
  - prompt: "Byte's first version ran `math.cos(90)` and got about -0.45, with no error. Why no error?"
    choices:
      - "90 counts as 90 radians: a valid angle, so nothing to complain about"
      - "math.cos only raises an error for negative numbers of degrees, and 90 is positive"
      - "-0.45 really is the cosine of 90 degrees, so the robot's bug must be somewhere else"
    answer: 0
    explain: "`math.cos` happily takes any number of radians. 90 radians is about 5157 degrees, whose cosine is about -0.45. Unit mix-ups give wrong numbers, not crashes, which is why we test on poses we can picture."
  - prompt: "Why is the forearm's direction `shoulder + elbow` and not just `elbow`?"
    choices:
      - "The elbow is measured from the upper arm, which the shoulder has already turned"
      - "The forearm is shorter than the upper arm, so its angle needs the shoulder added on"
      - "It only matters when the elbow is bent: with a straight elbow you can leave the shoulder out"
    answer: 0
    explain: "Each joint's angle is relative to the link before it. Swing the shoulder up 90° with a straight elbow and the forearm points up too, even though the elbow angle is still 0."
