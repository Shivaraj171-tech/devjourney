id: s40
title: "Robotics Lab"
icon: "🤖"
# A side floor: its own small codebase (the grabby/ package), opened as a whole
# once Season 1 is done, never gating anything (the final exam stays on the story).
chain: false
requires: s01-t10
intro: >
  Orbit Orders bought a packing arm for the kitchen. It's called **Grabby**. Rosa,
  our new robotics engineer, is teaching it to find boxes, reach them, move
  smoothly, hold steady, learn by trial and error, and guess which grasps will
  work. Byte has "helped" with every module. Each ticket teaches one robotics or
  machine-learning idea, and after every run the Lab viewer shows what your code
  made Grabby do. The floor sits beside the main story, so take it whenever you
  like; nothing in the story waits for it.
tickets:
  - t01-where-is-the-gripper
  - t02-reach-for-the-box
  - t03-out-of-reach
  - t04-smooth-moves
  - t05-shaky-shoulder
  - t06-learning-to-reach
  - t07-too-good-to-be-true
  - t08-exploding-network
