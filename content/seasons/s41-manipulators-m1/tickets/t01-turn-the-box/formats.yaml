      print([round(c, 2) for c in new])
    question: "What does this print?"
    answer: "[0.0, 2.0]"
    choices:
      - "[0.0, 2.0]"
      - "[0.0, -2.0]"
      - "[2.0, 0.0]"
      - "[-2.0, 0.0]"
    explain: >-
      (2, 0) is two steps along x. A quarter turn anticlockwise points x up, so it becomes two steps up:
      (0, 2). `round` keeps floats, and cos(90°) is 6e-17, which rounds to 0.0.
