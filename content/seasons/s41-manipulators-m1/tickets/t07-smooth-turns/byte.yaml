# Partial: Byte adds the short-way flip, but keeps the uneven normalised lerp.
suggestion:
  file: rigid/slerp.py
  find: "    return normalize(lerp(q0, q1, t))"
  replace: "    if dot(q0, q1) < 0:\n        q1 = [-c for c in q1]  # same orientation, the short way round\n    return normalize(lerp(q0, q1, t))"
  correct: true
  partial: true
  why:
    choices:
      - "Accept: the flip is right (q and -q are the same turn), but the speed problem is still there to fix."
      - "Reject: negating q1 turns the box to the opposite orientation, so Grabby will place it upside down."
      - "Accept: with the flip, normalised lerp and slerp give identical results for every t."
    answer: 0
  says: "Long way round? q and -q are the same rotation, so flip q1 when the dot is negative. Sorted."
  explain: >-
    The flip is exactly right: -q1 is the same orientation, and blending towards it is the short arc, so the
    200° swing is gone. But the blend is still a normalised straight line, which rushes through the middle of a
    big turn (15.6° then 23.7° per step instead of 20°). For constant speed you need the sine weights.
