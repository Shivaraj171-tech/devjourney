      def frame_after(names):
          frame = names[0][0]
          for a, b in names:
              if a != frame:
                  return "mismatch at " + a
              frame = b
          return frame

      result = frame_after([("base", "shoulder"), ("shoulder", "wrist"), ("wrist", "gripper")])
