questions:
  - prompt: "Where should the expected answers in your tests come from?"
    choices:
      - "From the spec (SPEC-41), written down by you"
      - "From running Byte's late_voucher and copying what it returns"
      - "From asking Byte what the answers should be"
    answer: 0
    explain: "Tests are only useful if they can disagree with the code. If you copy the code's answers (or ask the AI that wrote it), your tests just repeat its mistakes."
  - prompt: "Byte's second attempt used >= 60 instead of > 60. Which test catches it?"
    choices:
      - "assert late_voucher(90) == 500"
      - "assert late_voucher(60) == 300"
      - "assert late_voucher(30) == 0"
    answer: 1
    explain: "With >= 60, exactly 60 minutes gets 500 instead of 300. 90 and 30 give the same answer either way, so only the edge catches it."
  - prompt: "Byte's attempt 1 used `>= 45` for the $3.00 voucher. Which test catches it?"
    choices:
      - "assert late_voucher(46) == 300"
      - "assert late_voucher(45) == 0"
      - "assert late_voucher(61) == 500"
      - "assert late_voucher(30) == 0"
    answer: 1
    explain: "With >= 45, exactly 45 minutes gets 300 instead of 0. 46, 61 and 30 give the same voucher either way, so only the edge catches it."
