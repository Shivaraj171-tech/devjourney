id: s43
title: "Manipulators · Module 3: Velocity kinematics"
icon: "🦾"
# A deep side floor: module 3 of 8 of the manipulator track (see README). Its codebase
# starts from Module 2's final kin/ + rigid/ packages and adds vel/ (numeric and analytic
# Jacobians, the UR5e's 6x6 Jacobian, space and body Jacobians, singularities,
# manipulability ellipsoids, statics). It opens once Module 2 is done.
chain: false
requires: s42-t11
lesson: long
short_title: "Manipulators · M3"
intro: >
  **Module 3 of 8: Velocity kinematics.** Forward kinematics says where the gripper is.
  This module asks how FAST it moves when the joints turn, and in which directions it
  can't move at all. Rosa takes you from differentiating a two-link arm numerically to
  the Jacobian derived by hand, the geometric Jacobian of any arm, the UR5e's full 6x6
  Jacobian checked by finite differences, space and body Jacobians, singularities, the
  manipulability ellipsoid (watch it go flat in 3D) and the forces the same matrix sends
  back to the motors. Optional: it never blocks the main story.
