questions:
  - prompt: "For the two-link arm, det J = l1 l2 sin(q2). Which poses are singular?"
    choices:
      - "q2 = 0 or q2 = π: stretched out or folded back, whatever q1 is"
      - "q1 = 0: the upper arm along the x axis"
      - "q1 + q2 = 90°: the forearm pointing straight up"
      - "None: a 2x2 matrix built from sines and cosines is always invertible"
    answer: 0
    explain: "det J depends only on q2, the arm's shape. Turning the whole arm (q1) can't create or remove a singularity."
  - prompt: "Column 1 of the two-link Jacobian equals (-y, x). What does that say geometrically?"
    choices:
      - "Turning the shoulder moves the gripper perpendicular to the shoulder-gripper line, at speed |p|"
      - "The gripper moves straight towards the shoulder, at a speed of l1, when joint 1 turns"
      - "Joint 1 only moves the elbow, never the gripper"
    answer: 0
    explain: "(-y, x) is the position turned by 90°: a circle around the shoulder, with speed equal to the radius (at 1 rad/s)."
  - prompt: "Byte's Jacobian uses sin(q2) where the formula has sin(q1 + q2). At which poses does it still give the right answer?"
    choices:
      - "Exactly when q1 = 0 (and, by periodicity, multiples of 2π)"
      - "At every pose: sine is periodic, so sin(q2) and sin(q1 + q2) always agree"
      - "Only at singular poses"
    answer: 0
    explain: "q1 + q2 = q2 only when q1 = 0. That's why testing at q1 = 0 alone hid the bug."
  - prompt: "The arm is stretched out along x (q = (0, 0)). The gripper is asked to move at (1, 0) m/s, along the arm. What joint speeds do that?"
    choices:
      - "None: both columns point along y, so no combination moves along x"
      - "q̇1 = 1 rad/s, q̇2 = 0"
      - "q̇1 = 0, q̇2 = 1 rad/s"
    answer: 0
    explain: "Stretched out, J = [[0, 0], [l1 + l2, l2]]: every velocity it can make is along y. Moving along the arm needs infinite speed: a singularity."
