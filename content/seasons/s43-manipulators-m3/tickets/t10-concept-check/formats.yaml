      import math
      l1, l2 = 0.5, 0.4
      def det_J(q2):
          return l1 * l2 * math.sin(q2)
      def speeds_needed(q2):
          return round(1 / abs(det_J(q2)), 1)
      print(speeds_needed(math.pi / 2), speeds_needed(0.1), speeds_needed(0.01))
