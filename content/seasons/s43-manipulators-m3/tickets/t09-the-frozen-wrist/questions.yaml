questions:
  - prompt: "The monitor reported κ = 204.4 at q5 = 28°, where the true σ_max / σ_min is 14.3. What explains it?"
    choices:
      - "It computed λ_max / λ_min of Jᵀ J, which is κ²"
      - "The UR5e's Jacobian is wrong at that pose"
      - "κ depends on the joint speeds, which were high"
      - "The threshold should have been 2000"
    answer: 0
    explain: "14.3² = 204.5 ≈ 204.4. The eigenvalues of Jᵀ J are the squared singular values."
  - prompt: "Near the UR5e's wrist flip, the same 0.2 rad/s spin needs joint 4 to turn at roughly..."
    choices:
      - "a speed that grows like 1 / sin(q5): 14 rad/s at q5 = 1°"
      - "0.2 rad/s, whatever q5 is"
      - "0 rad/s: joints 4 and 6 lock and stop moving at a wrist singularity"
    answer: 0
    explain: "σ_min shrinks with sin(q5), and q̇ = J⁻¹ V scales with 1/σ_min. The chart under the 3D view shows joints 4 and 6 racing in opposite directions."
  - prompt: "Someone switches the UR5e code to millimetres. Why does the monitor's stop threshold of 200 stop meaning anything?"
    choices:
      - "J's linear rows grow 1000x and its angular rows don't, so κ changes"
      - "It doesn't: κ = σ_max / σ_min is the same whatever the units are"
      - "κ only changes if the joint angles are switched to degrees as well"
    answer: 0
    explain: "κ is unchanged only by UNIFORM scaling. Millimetres multiply the three linear rows (m/s) by 1000 and leave the angular rows (rad/s) alone: at q5 = 7.4° κ goes from 50 to about 9,800. For a mixed-unit J the thresholds belong to its units (metres and radians here); dividing the linear rows by a characteristic length makes κ unit-free."
  - prompt: "Byte argued that dropping the square root keeps the ordering of the singular values. Why is that not enough?"
    choices:
      - "The monitor compares κ with fixed thresholds, and squaring moves where they trip"
      - "Square roots of floats are inaccurate, so after the root the ordering of the σ can change"
      - "It is enough: only the ordering matters for a monitor"
    answer: 0
    explain: "Ordering-only uses (sorting, finding the smallest) survive squaring; comparisons with a number tuned in real units don't."
