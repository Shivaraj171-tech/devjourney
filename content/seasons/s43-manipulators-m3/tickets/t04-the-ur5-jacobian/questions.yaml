questions:
  - prompt: "R is the flange's orientation and Ṙ its rate of change. Which product gives the angular velocity in the BASE frame?"
    choices:
      - "Ṙ Rᵀ"
      - "Rᵀ Ṙ"
      - "Ṙ R"
      - "R Ṙᵀ R"
    answer: 0
    explain: "Each column of R moves as w × column, so Ṙ = [w] R and [w] = Ṙ Rᵀ. Rᵀ Ṙ is the same spin in the flange's own axes."
  - prompt: "Your Jacobian and your finite-difference checker disagree. What's the best next step?"
    choices:
      - "Test each against a case whose answer you know by hand"
      - "Trust the Jacobian: it was written first and the rest of the code uses it"
      - "Trust the checker: finite differences can't be wrong"
      - "Loosen the tolerance until they agree"
    answer: 0
    explain: "Both are code, both can have bugs. A hand-solvable case (a single spin about z) tells you which one lies."
  - prompt: "Why do the UR5's Jacobian columns need the six DH frames, and not just the joint angles?"
    choices:
      - "Each column needs that joint's axis and a point on it, in the base frame"
      - "The angles are in degrees and the frames convert them to radians"
      - "They don't: J only depends on the DH table, not on q"
    answer: 0
    explain: "Column i = [z(i-1) × (p6 - p(i-1)); z(i-1)]: both z(i-1) and p(i-1) come from frame i-1, which moves with q."
  - prompt: "How many forward-kinematics runs does a central-difference 6x6 Jacobian cost?"
    choices:
      - "12: two per joint (plus one at q itself, for R)"
      - "6: one per joint"
      - "36: one per entry"
    answer: 0
    explain: "Each column needs the pose at q + h e_i and q - h e_i. That's why the analytic (geometric) Jacobian is the one used in control loops."
