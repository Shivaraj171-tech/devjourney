id: s01
title: "Your First Week"
intro: >
  Welcome to Orbit Orders! We're a small team building a food-ordering app,
  and as of today you're our newest junior developer. Your first week is all
  about getting comfortable in the codebase: small fixes, real users, real impact.
  Your tech lead, Maya, has already queued up a few tickets for you. Heads-up:
  some of this code was suggested by Byte, the office robot's autocomplete,
  and accepted without checking. Learning to spot that is part of the job.
