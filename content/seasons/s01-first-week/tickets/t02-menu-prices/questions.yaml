questions:
  - prompt: "Why does Orbit Orders store prices in cents (1250) instead of dollars (12.50)?"
    choices:
      - "Python can only show two decimal places for numbers that started as whole cents"
      - "Whole cents are exact; decimals like 0.1 can be slightly off"
      - "Cents use less memory than dollars"
    answer: 1
    explain: "Decimal (float) numbers can be slightly off, like 0.1 + 0.2 giving 0.30000000000000004. Whole cents are always exact."
  - prompt: "What does 1250 / 10 give, and why was the menu wrong?"
    choices:
      - "12.5, so the menu was actually right"
      - "125.0: dividing by 10 instead of 100 leaves every price ten times too big"
      - "1.25: dividing by 10 instead of 100 makes every price 10 times too small"
    answer: 1
    explain: "1250 / 10 is 125.0. There are 100 cents in a dollar, so you need to divide by 100 to get 12.5."
  - prompt: "Byte's autocomplete offers `dollars = cents / 10`. Which test would catch it?"
    choices:
      - "assert format_price(0) == \"$0.00\""
      - "assert format_price(1250) == \"$12.50\""
      - "assert format_price(299).startswith(\"$\") and \".\" in format_price(299)"
    answer: 1
    explain: "Only a known price with a known label shows the 10x error. 0 is $0.00 either way, and \"$29.90\" still starts with $ and has a dot."
