      total_cents = 1000
      people = 3
      print(total_cents / people)
      print(total_cents // people)
    question: "Three friends split a $10.00 bill (1000 cents). What does this print?"
    answer: |
      333.3333333333333
      333
    choices:
      - |
        333.3333333333333
        333
      - |
        333
        333
      - |
        333.33
        333.0
      - |
        333.3333333333333
        333.3333333333333
    explain: >-
      `/` always gives a float, even when it can't be split evenly, so you get all those 3s.
      `//` rounds down to a whole number: 333. Three shares of 333 cents add up to 999, so a cent
      goes missing. Keep that in mind when Byte splits a bill.
