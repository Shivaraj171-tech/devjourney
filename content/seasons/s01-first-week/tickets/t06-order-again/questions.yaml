questions:
  - prompt: "With menu = {\"lemonade\": 299}, what happens when you run menu[\"garlic_bread\"]?"
    choices:
      - "It gives 0, the default for a missing price"
      - "It gives None, because there's no value for that key"
      - "It raises a KeyError"
    answer: 2
    explain: "Square-bracket lookup only works for keys that exist. For a missing key, Python raises KeyError instead of guessing a value."
  - prompt: "What does \"garlic_bread\" in menu check?"
    choices:
      - "Whether any price in the menu equals \"garlic_bread\""
      - "Whether \"garlic_bread\" is one of the dictionary's keys"
      - "Whether the word appears anywhere in the item names, even as part of a longer name"
    answer: 1
    explain: "For a dictionary, `in` checks the keys. It's a safe way to ask \"is this on the menu?\" before looking it up."
  - prompt: "Byte suggests `cart.append(menu.get(name))` to stop the KeyError. Which check catches what's still wrong?"
    choices:
      - "Check that reorder([\"lemonade\"], {\"lemonade\": 299}) gives [299]"
      - "Check that reorder([\"garlic_bread\"], {\"lemonade\": 299}) gives []"
      - "Check that reorder([], {\"lemonade\": 299}) gives []"
      - "Check that reorder([\"garlic_bread\"], {\"lemonade\": 299}) gives at most one item"
    answer: 1
    explain: "No crash, but a removed item becomes None in the cart: [None] is not []. The other checks pass on Byte's version, so they can't catch it."
