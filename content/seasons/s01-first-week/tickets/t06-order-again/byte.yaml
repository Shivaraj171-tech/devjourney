# Correct: check the menu first, so removed items are skipped instead of crashing.
suggestion:
  file: app/reorder.py
  find: "        cart.append(menu[name])"
  replace: "        if name in menu:\n            cart.append(menu[name])"
  correct: true
  says: "Check the item is still on the menu before looking it up. Removed items get skipped, like the docstring says."
  explain: >-
    Correct. `name in menu` checks the keys, so menu[name] only runs for items that still exist. Compare
    with the tempting `menu.get(name)`, which stops the crash but puts None in the cart.
