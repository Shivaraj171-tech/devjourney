# No crash any more... and a free garlic bread instead.
suggestion:
  file: app/reorder.py
  find: "        cart.append(menu[name])"
  replace: "        cart.append(menu.get(name, 0))"
  correct: false
  why:
    choices:
      - "`.get()` avoids the KeyError, and the crash was the whole bug."
      - "A removed item goes in as a $0.00 item instead of being skipped."
      - "Dictionaries have no `.get()`, so this crashes with a new error."
    answer: 1
  says: "`.get()` never raises KeyError. Removed items just default to 0. Crash fixed!"
  explain: >-
    The crash is gone, but a removed item now goes into the cart as a $0.00 item, so the cart becomes
    `[1250, 0, 299]` instead of skipping it. The docstring says removed items are skipped. Making an
    error disappear isn't the same as doing the right thing: check `if name in menu:` before appending.
