questions:
  - prompt: "Why did Ana's new order contain Sam's items?"
    choices:
      - "add_item adds the price to every order that exists at that moment"
      - "The default list in items=[] is made once, so every call that leaves items out shares it"
      - "Python reuses the old order dictionary when create_order is called again"
    answer: 1
    explain: "Default values are created when the function is defined. Both orders pointed at the same list, so adding to one showed up in the other."
  - prompt: "Why does items=None with \"if items is None: items = []\" fix it?"
    choices:
      - "Using None as a default makes Python copy the list automatically"
      - "items = [] runs on every call, making a new list"
      - "It doesn't really fix it; the list is still shared, just harder to spot"
    answer: 1
    explain: "The line inside the function runs each time create_order is called, creating a fresh empty list for every new order."
  - prompt: "An AI writes `def create_order(customer, items=[])`. Which test catches the shared list?"
    choices:
      - "assert create_order(\"Sam\")[\"items\"] == []"
      - "create_order(\"Sam\")[\"items\"].append(1); assert create_order(\"Ana\")[\"items\"] == []"
      - "assert create_order(\"Lee\", [450])[\"items\"] == [450]"
      - "assert create_order(\"Sam\")[\"customer\"] == \"Sam\" and create_order(\"Ana\")[\"customer\"] == \"Ana\""
    answer: 1
    explain: "The shared list only shows up when one order adds an item and a LATER order is created. A single new order is always empty on the first call."
