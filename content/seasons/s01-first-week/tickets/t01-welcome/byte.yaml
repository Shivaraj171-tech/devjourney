# Byte's very first suggestion: the f is back, but retyping the line quietly lost the comma.
suggestion:
  file: app/greeting.py
  find: "    return \"Welcome back to Orbit Orders, {name}!\""
  replace: "    return f\"Welcome back to Orbit Orders {name}!\""
  correct: false
  why:
    choices:
      - "The `f` is there now, so `{name}` gets filled in and it's right."
      - "Retyping the line dropped the comma after Orbit Orders."
      - "An f-string can't hold `{name}`, so it would crash."
    answer: 1
  says: "Missing `f`! Without it, Python prints `{name}` as plain text. Fixed. 🤖"
  explain: >-
    The `f` is right, but Byte retyped the whole line and dropped the comma: customers would now see
    "Welcome back to Orbit Orders Sam!". When an AI rewrites a line, compare ALL of it with what it
    should say, not just the part you asked about. The tests compare the exact text, so they catch it.
