questions:
  - prompt: "Why did the greeting show the literal text {name}?"
    choices:
      - "The name variable was empty when greet() ran"
      - "The string had no f in front, so Python left {name} as plain text"
      - "greet() needs a print() inside it before {name} gets filled in"
    answer: 1
    explain: "Only f-strings replace {name} with the variable's value. Without the f, the curly braces are just ordinary characters."
  - prompt: "With name = \"Sam\", what does f\"Hi, {name}!\" give you?"
    choices:
      - "\"Hi, {name}!\""
      - "\"Hi, name!\""
      - "\"Hi, Sam!\""
      - "An error, because name needs quotes inside the braces"
    answer: 2
    explain: "Inside an f-string, {name} is replaced by the value of the variable name, which is \"Sam\"."
  - prompt: "Byte autocompletes `return \"Welcome back to Orbit Orders, {name}!\"` (no f). Which check would catch it?"
    choices:
      - "Check that greet(\"Sam\") starts with \"Welcome back to Orbit Orders, \""
      - "Check that \"Sam\" appears in greet(\"Sam\")"
      - "Check that greet(\"Sam\") gives back some text that isn't empty"
    answer: 1
    explain: "Only a check that looks for the real name can tell {name} from Sam. The other two pass on Byte's line too."
