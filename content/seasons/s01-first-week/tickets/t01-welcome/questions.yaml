questions:
  - prompt: "Why did the greeting show the literal text {name}?"
    choices:
      - "The name variable was empty when greet() ran"
      - "The string had no f in front, so {name} stayed as text"
      - "greet() needs a print() inside it before {name} gets filled in"
    answer: 1
    explain: "Only f-strings replace {name} with the variable's value. Without the f, the curly braces are just ordinary characters."
  - prompt: "With name = \"Sam\", what does f\"Hi, {name}!\" give you?"
    choices:
      - "\"Hi, {name}!\""
      - "\"Hi, name!\""
      - "\"Hi, Sam!\""
      - "An error, because name needs quotes inside the braces"
    answer: 2
    explain: "Inside an f-string, {name} is replaced by the value of the variable name, which is \"Sam\"."
  - prompt: "Byte autocompletes `return \"Welcome back to Orbit Orders, {name}!\"` (no f). Which test would catch it?"
    choices:
      - "assert greet(\"Sam\").startswith(\"Welcome back to Orbit Orders, \")"
      - "assert \"Sam\" in greet(\"Sam\")"
      - "assert isinstance(greet(\"Sam\"), str) and greet(\"Sam\") != \"\""
    answer: 1
    explain: "Only a test that looks for the real name can tell {name} from Sam. The other two pass on Byte's line too."
