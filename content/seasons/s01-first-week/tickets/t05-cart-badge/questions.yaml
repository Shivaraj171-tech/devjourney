questions:
  - prompt: "After cart = [1250] and then cart.append(299), what is cart?"
    choices:
      - "[299, 1250]"
      - "[1250, 299]"
      - "[1549]"
      - "[1250] (append only returns a new list)"
    answer: 1
    explain: "append adds the value to the end of the same list. It doesn't add the numbers together or make a copy."
  - prompt: "Why doesn't add_item need a return statement?"
    choices:
      - "Python returns the last line of every function automatically"
      - "append changes the cart list the caller passed in, so the caller already sees the new item"
      - "It does need one: without return the new item is lost when the function ends"
    answer: 1
    explain: "Lists can be changed in place. The test's cart and the function's cart are the same list, so the change shows up outside the function too."
  - prompt: "Byte writes add_item as `return cart + [price_cents]`. Which test catches it?"
    choices:
      - "assert item_count([1, 2]) == 2"
      - "cart = [1]; add_item(cart, 2); assert cart == [1, 2]"
      - "assert add_item([1], 2) == [1, 2]"
      - "assert len([1] + [2]) == 2 and item_count([]) == 0"
    answer: 1
    explain: "Only checking the cart itself shows whether add_item changed it. Checking the return value would fail on the correct version too, which returns None."
