questions:
  - prompt: "With subtotal_cents = 2500, which condition is True?"
    choices:
      - "subtotal_cents > 2500"
      - "subtotal_cents >= 2500"
      - "Both of them, because 2500 is exactly the threshold"
    answer: 1
    explain: "2500 is not greater than 2500, but it is greater than or equal to it. That one character was the whole bug."
  - prompt: "Why do the tests check 2499 and 2500 instead of just a big order like 4000?"
    choices:
      - "A big order like 4000 would also catch it, but small numbers make tests easier to read"
      - "The bug only shows right at the limit, so test both sides of it"
      - "Tests must use the numbers from the docstring, and 2500 is the one it mentions"
    answer: 1
    explain: "These are called edge cases. A big order like 4000 is free with both > and >=, so only a test right at the boundary catches the mistake."
  - prompt: "An AI writes `if subtotal_cents > 2500:` for \"free delivery at $25 or more\". Which amount should you test first?"
    choices:
      - "4000, a big order that is clearly over the limit"
      - "2500, exactly the limit"
      - "0, an empty cart, because empty input breaks most code"
    answer: 1
    explain: "4000 and 0 give the right fee with both > and >=. Only the exact limit shows whether the AI picked the right comparison."
