questions:
  - prompt: "Which numbers does range(3) produce?"
    choices:
      - "0, 1, 2"
      - "1, 2, 3"
      - "0, 1, 2, 3"
    answer: 0
    explain: "range(3) starts at 0 and stops just before 3. That's three numbers, one for each index of a 3-item list."
  - prompt: "Why did the buggy loop skip the last item?"
    choices:
      - "Python lists start at 1, so prices[0] was never counted"
      - "range(len(prices) - 1) stops one index too early, so the last price is never added"
      - "total was set back to 0 inside the loop, so only part of the cart was added"
    answer: 1
    explain: "Subtracting 1 meant the loop never reached the last index. This kind of 'off by one' mistake is one of the most common bugs in any language."
  - prompt: "Byte's autocomplete wrote `for i in range(len(prices) - 1):`. Which test would catch it?"
    choices:
      - "assert cart_subtotal([]) == 0"
      - "assert cart_subtotal([1, 2]) == 3"
      - "assert cart_subtotal([0, 0]) == 0"
      - "assert cart_subtotal([5, 0]) == 5"
    answer: 1
    explain: "The bug drops the last item, so the test needs a last item that isn't 0. [] and [0, 0] add up the same either way, and [5, 0] only loses a 0."
