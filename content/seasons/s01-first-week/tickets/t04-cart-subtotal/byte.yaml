# Correct, and simpler than fixing the range: loop over the prices themselves.
suggestion:
  file: app/cart.py
  find: "    for i in range(len(prices) - 1):\n        total = total + prices[i]"
  replace: "    for price in prices:\n        total = total + price"
  correct: true
  says: "No need to count positions at all: loop over the prices themselves and nothing gets skipped."
  explain: >-
    Correct. `for price in prices` visits every item exactly once, so there is no start or stop number
    to get wrong. Byte is right more often than not, but it sounds just as sure when it isn't: the tests
    are how you tell which time this is.
